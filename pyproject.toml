[project]
name = "quorum"
version = "0.1.0"
description = "A replicated key-value store built on Raft, with a deterministic simulator and a linearizability checker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
quorum = "quorum.cli:main"

[tool.setuptools]
packages = ["quorum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
